<!doctype html>
<html>
  <head>
    <title>My Media Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <style>
      h1 {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>

    <iframe
      width="420"
      height="236"
      src="https://www.youtube.com/embed/watch?v=89dGC8de0CA&list=RD89dGC8de0CA&start_radio=1"
      title="YouTube video"
      allowfullscreen
    >
    </iframe>

    <h2>Local Video</h2>

    <video width="400" controls>
      <source src="images/Aerosmith - Dream On (Audio).mp4" type="video/mp4" />
      <source src="myvideo.ogg" type="video/ogg" />
      Your browser does not support the video tag.
    </video>

    <h2>Audio Clip</h2>

    <audio controls>
      <source
        src="images/Aerosmith - Dream On (Audio) (1).mp3"
        type="audio/mpeg"
      />
      Your browser does not support the audio tag.
    </audio>

    <h2>Google Map</h2>
    <iframe
      src="https://www.google.com/maps?q=PCPS+College+Kupondole+Lalitpur&output=embed"
      width="400"
      height="300"
      style="border: 0"
      loading="lazy"
    >
    </iframe>

    <h2>Embedded Webpage</h2>
    <iframe
      src="https://www.wikipedia.org"
      width="400"
      height="250"
      title="Wikipedia"
    ></iframe>

    <h2>PDF Document</h2>

    <embed src="./123.pdf" type="application/pdf" width="400" height="300" />
  </body>
</html>
